[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-grpo"
version = "0.1.0"
description = "Evidence-linked ledger judging and span-aware group policy advantages"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = ["torch>=2.0"]

[project.scripts]
ledger-grpo = "ledger_grpo.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
